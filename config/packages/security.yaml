security:
    encoders:
        App\Entity\User:
            algorithm: auto

    # https://symfony.com/doc/current/security.html#where-do-users-come-from-user-providers
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            anonymous: lazy
            guard:
                authenticators:
                    - App\Security\LoginFormAuthenticator
            logout:
                path: app_logout

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#firewalls-authentication

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    role_hierarchy:
        ROLE_DEVELOPER: [ROLE_ADMIN, ROLE_ALLOWED_TO_SWITCH]
        ROLE_SUPER_ADMIN: [ROLE_ADMIN, ROLE_ALLOWED_TO_SWITCH]
        ROLE_ADMIN: [ROLE_MANAGER]
        ROLE_MANAGER: [ROLE_STAFF, ROLE_FREELANCER]
        ROLE_ACCOUNT_MANAGER: [ROLE_STAFF, ROLE_CLIENT_OWNER]
        ROLE_CLIENT_OWNER: [ROLE_CLIENT]
        ROLE_STAFF: [ROLE_USER]
        ROLE_FREELANCER: [ROLE_USER]
        ROLE_CLIENT: [ROLE_USER]
    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        - { path: ^/login$, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/dev/*, roles: ROLE_DEVELOPER }
        - { path: ^/admin/*, roles: ROLE_ADMIN }
        - { path: ^/manager/*, roles: ROLE_MANAGER }
        - { path: ^/files/*, roles: ROLE_STAFF }
        # - { path: ^/admin, roles: ROLE_ADMIN }
        # - { path: ^/profile, roles: ROLE_USER }
